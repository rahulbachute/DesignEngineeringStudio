<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Faculty Self-Registration - Design Engineering Studio" />
    <title>Faculty Registration | Design Engineering Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/faculty.css" rel="stylesheet" />
    <style>
      :root {
        --des-primary: #2563eb;
        --des-primary-dark: #1d4ed8;
        --des-bg: #0f172a;
        --des-card-bg: #1e293b;
        --des-border: #334155;
        --des-text: #f8fafc;
        --des-text-muted: #94a3b8;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at 10% 20%, #1e293b 0%, #0f172a 90%);
        color: var(--des-text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      h1, h2, h3, h4, h5, .brand-font {
        font-family: 'Outfit', sans-serif;
      }
      .reg-card {
        background-color: var(--des-card-bg);
        border: 1px solid var(--des-border);
        border-radius: 1rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        max-width: 580px;
        width: 100%;
        overflow: hidden;
      }
      .reg-header {
        background: linear-gradient(135deg, rgba(37,99,235,0.2) 0%, rgba(30,41,59,0.8) 100%);
        border-bottom: 1px solid var(--des-border);
        padding: 2rem 2rem 1.5rem;
      }
      .form-control, .form-select {
        background-color: #0f172a !important;
        border-color: #334155 !important;
        color: #f8fafc !important;
        border-radius: 0.5rem;
        padding: 0.65rem 0.9rem;
      }
      .form-control:focus, .form-select:focus {
        border-color: #3b82f6 !important;
        box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important;
      }
      .form-label {
        font-weight: 500;
        font-size: 0.875rem;
        color: var(--des-text-muted);
        margin-bottom: 0.35rem;
      }
      .btn-primary-gradient {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        border: none;
        color: #fff;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: all 0.2s ease;
      }
      .btn-primary-gradient:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37,99,235,0.35);
      }
      .input-group-text {
        background-color: #0f172a;
        border-color: #334155;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="reg-card">
      <div class="reg-header text-center">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-25 rounded-circle p-3 mb-3" style="width: 60px; height: 60px;">
          <i class="bi bi-person-badge text-primary fs-3"></i>
        </div>
        <h2 class="h4 text-white fw-bold mb-1">Faculty Registration</h2>
        <p class="text-secondary small mb-0">Design Engineering Studio (DES) / MEILP</p>
      </div>

      <div class="p-4">
        <!-- Error Alert -->
        <div id="regErrorAlert" class="alert alert-danger d-none py-2 px-3 small mb-3" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i><span id="regErrorMessage"></span>
        </div>

        <!-- Success Alert / Card -->
        <div id="regSuccessCard" class="d-none text-center py-3">
          <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-25 rounded-circle p-3 mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-check-circle-fill text-success fs-2"></i>
          </div>
          <h4 class="text-white fw-bold mb-2">Registration Successful!</h4>
          <p class="text-muted small mb-3">Your faculty profile has been created and is now active.</p>
          
          <div class="bg-dark p-3 rounded-3 mb-4 text-start border border-secondary border-opacity-25">
            <div class="d-flex justify-content-between mb-1">
              <span class="text-secondary small">Faculty ID:</span>
              <span id="succFacultyId" class="badge bg-primary fs-6 fw-bold"></span>
            </div>
            <div class="d-flex justify-content-between mb-1">
              <span class="text-secondary small">Faculty Name:</span>
              <span id="succFacultyName" class="text-white fw-medium small"></span>
            </div>
            <div class="d-flex justify-content-between">
              <span class="text-secondary small">Email:</span>
              <span id="succFacultyEmail" class="text-white small"></span>
            </div>
          </div>

          <a id="btnProceedToLogin" href="../index.html" class="btn btn-primary-gradient w-100 mb-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Proceed to Login
          </a>
        </div>

        <!-- Registration Form -->
        <form id="facultyRegistrationForm" onsubmit="event.preventDefault(); handleFacultyRegistration(event); return false;">
          
          <!-- Full Name -->
          <div class="mb-3">
            <label for="regFacultyName" class="form-label">Full Name (with Salutation) <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="regFacultyName" placeholder="e.g. Dr. Rajesh Sharma" required autocomplete="name" />
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="regEmail" class="form-label">Official / Personal Email (Login ID) <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="regEmail" placeholder="e.g. rajesh.sharma@dypic.in" required autocomplete="email" />
            </div>
          </div>

          <!-- College -->
          <div class="mb-3">
            <label for="regCollege" class="form-label">Affiliated College / Institute <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-building"></i></span>
              <select class="form-select" id="regCollege" required>
                <option value="COL001" data-name="Ajeenkya D.Y. Patil School of Engineering, Lohegaon" selected>Ajeenkya D.Y. Patil School of Engineering, Lohegaon</option>
                <option value="COL002" data-name="Jaihind College of Engineering">Jaihind College of Engineering</option>
                <option value="COL009" data-name="Other – Maharashtra">Other – Maharashtra</option>
              </select>
            </div>
          </div>

          <!-- Department -->
          <div class="mb-3">
            <label for="regDepartment" class="form-label">Department <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-gear-wide-connected"></i></span>
              <input type="text" class="form-control" id="regDepartment" value="Mechanical Engineering" required />
            </div>
          </div>

          <!-- Password Row -->
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="regPassword" class="form-label">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="regPassword" placeholder="Min. 6 chars" minlength="6" required autocomplete="new-password" />
              </div>
            </div>
            <div class="col-md-6">
              <label for="regConfirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control" id="regConfirmPassword" placeholder="Repeat password" minlength="6" required autocomplete="new-password" />
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btnSubmitRegistration" class="btn btn-primary-gradient w-100 mb-3">
            <i class="bi bi-person-check-fill me-1"></i> Register Faculty Profile
          </button>

          <!-- Back to Login -->
          <div class="text-center">
            <span class="text-secondary small">Already registered?</span>
            <a href="../index.html" class="text-primary small fw-semibold text-decoration-none ms-1">
              Back to Login
            </a>
          </div>

        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script>
      // Populate colleges immediately from window.MEILP.colleges, then optionally refresh from live backend
      document.addEventListener("DOMContentLoaded", async function () {
        const sel = document.getElementById("regCollege");
        if (!sel) return;

        function populateList(list) {
          sel.innerHTML = "";
          list.forEach((col, idx) => {
            const opt = document.createElement("option");
            if (typeof col === "string") {
              const code = "COL" + ("000" + (idx + 1)).slice(-3);
              opt.value = code;
              opt.textContent = col;
              opt.setAttribute("data-name", col);
              if (col.includes("Ajeenkya D.Y. Patil")) opt.selected = true;
            } else {
              opt.value = col.collegeId || col.id;
              opt.textContent = col.collegeName || col.name;
              opt.setAttribute("data-name", col.collegeName || col.name);
              if ((col.collegeName || "").includes("Ajeenkya D.Y. Patil")) opt.selected = true;
            }
            sel.appendChild(opt);
          });
        }

        if (window.MEILP && Array.isArray(window.MEILP.colleges) && window.MEILP.colleges.length > 0) {
          populateList(window.MEILP.colleges);
        }

        const endpoint = (window.MEILP && window.MEILP.googleSheetsConfig && window.MEILP.googleSheetsConfig.submissionWebAppUrl);
        if (!endpoint) return;
        try {
          const res = await fetch(`${endpoint}?action=getColleges`);
          if (res.ok) {
            const data = await res.json();
            const liveColleges = data.data || data;
            if (Array.isArray(liveColleges) && liveColleges.length > 2) {
              populateList(liveColleges);
            }
          }
        } catch (e) {
          console.warn("Using built-in college list:", e.message);
        }
      });

      async function handleFacultyRegistration(e) {
        if (e) e.preventDefault();
        const errAlert = document.getElementById("regErrorAlert");
        const errMsg = document.getElementById("regErrorMessage");
        const submitBtn = document.getElementById("btnSubmitRegistration");
        const form = document.getElementById("facultyRegistrationForm");
        const successCard = document.getElementById("regSuccessCard");

        errAlert.classList.add("d-none");

        const name = document.getElementById("regFacultyName").value.trim();
        const email = document.getElementById("regEmail").value.trim().toLowerCase();
        const collegeSel = document.getElementById("regCollege");
        const collegeId = collegeSel.value;
        const collegeName = collegeSel.options[collegeSel.selectedIndex]?.getAttribute("data-name") || collegeSel.options[collegeSel.selectedIndex]?.text;
        const department = document.getElementById("regDepartment").value.trim();
        const password = document.getElementById("regPassword").value;
        const confirmPassword = document.getElementById("regConfirmPassword").value;

        if (password !== confirmPassword) {
          errMsg.textContent = "Passwords do not match. Please re-enter.";
          errAlert.classList.remove("d-none");
          return;
        }

        if (password.length < 6) {
          errMsg.textContent = "Password must be at least 6 characters.";
          errAlert.classList.remove("d-none");
          return;
        }

        const endpoint = (window.MEILP && window.MEILP.googleSheetsConfig && window.MEILP.googleSheetsConfig.submissionWebAppUrl);
        if (!endpoint) {
          errMsg.textContent = "Backend service configuration missing. Please contact administrator.";
          errAlert.classList.remove("d-none");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Registering Profile...';

        try {
          const payload = {
            facultyName: name,
            email: email,
            loginId: email,
            password: password,
            collegeId: collegeId,
            collegeName: collegeName,
            department: department
          };

          const res = await fetch(`${endpoint}?action=registerFaculty`, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });

          const json = await res.json();

          if (json && json.success && json.data) {
            const data = json.data;
            form.classList.add("d-none");
            successCard.classList.remove("d-none");

            document.getElementById("succFacultyId").textContent = data.facultyId || "FAC";
            document.getElementById("succFacultyName").textContent = data.facultyName || name;
            document.getElementById("succFacultyEmail").textContent = data.email || email;

            // Auto-login locally
            const userObj = {
              facultyId: data.facultyId,
              facultyName: data.facultyName || name,
              email: data.email || email,
              collegeId: data.collegeId || collegeId,
              collegeName: data.collegeName || collegeName,
              department: data.department || department,
              role: "FACULTY",
              status: "ACTIVE",
              isGuest: false
            };
            localStorage.setItem("DES_FACULTY_SESSION", JSON.stringify(userObj));
            localStorage.setItem("loggedInFaculty", userObj.facultyName);

            document.getElementById("btnProceedToLogin").href = "challenges.html";
            document.getElementById("btnProceedToLogin").innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Go to Faculty Workspace';
          } else {
            errMsg.textContent = json.error || "Registration failed. Please check your details.";
            errAlert.classList.remove("d-none");
          }
        } catch (err) {
          errMsg.textContent = "Network or server connection error: " + err.message;
          errAlert.classList.remove("d-none");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-person-check-fill me-1"></i> Register Faculty Profile';
        }
      }
    </script>
  </body>
</html>
