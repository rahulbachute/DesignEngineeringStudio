<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MEILP Sprint 2A reusable component demonstration.">
  <title>MEILP | Sprint 2A Component Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/theme.css" rel="stylesheet">
  <link href="components.css" rel="stylesheet">
</head>
<body class="component-demo-page">
  <main class="demo-shell">
    <div class="container">
      <header class="demo-header">
        <div>
          <span class="section-kicker">Sprint 2A</span>
          <h1>Reusable Component Demo</h1>
          <p>Student information, progress, and navigation components working together through the MEILP Platform Engine.</p>
        </div>
        <a class="btn btn-outline-primary" href="../index.html">
          <i class="bi bi-house" aria-hidden="true"></i>
          Home
        </a>
      </header>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="demo-stack">
            <div data-demo-student-info></div>
            <div data-demo-progress></div>
            <div data-demo-navigation></div>
          </div>
        </div>
        <div class="col-lg-4">
          <aside class="demo-status p-3" aria-label="Demo event log">
            <h2>Event Bus Activity</h2>
            <ul class="event-log" data-event-log></ul>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/storage.js" defer></script>
  <script src="../js/event-bus.js" defer></script>
  <script src="../js/state-manager.js" defer></script>
  <script src="../js/component-registry.js" defer></script>
  <script src="../js/base-component.js" defer></script>
  <script src="../js/progress-manager.js" defer></script>
  <script src="../js/router.js" defer></script>
  <script src="../js/utils.js" defer></script>
  <script src="../js/assignment-loader.js" defer></script>
  <script src="../js/engine.js" defer></script>
  <script src="student-info/student-info.js" defer></script>
  <script src="progress-bar/progress-bar.js" defer></script>
  <script src="assignment-navigation/assignment-navigation.js" defer></script>
  <script src="register-components.js" defer></script>
  <script src="demo.js" defer></script>
</body>
</html>
