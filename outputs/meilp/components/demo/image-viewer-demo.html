<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MEILP reusable Image Viewer component demo.">
  <title>MEILP | Image Viewer Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../components.css" rel="stylesheet">
</head>
<body class="component-demo-page">
  <main class="demo-shell">
    <div class="container">
      <header class="demo-header">
        <div>
          <span class="section-kicker">Sprint 2B</span>
          <h1>Image Viewer Demo</h1>
          <p>Responsive configurable media display with zoom, pan, loading states, error fallback, and fullscreen mode.</p>
        </div>
        <a class="btn btn-outline-primary" href="../demo.html">
          <i class="bi bi-ui-checks-grid" aria-hidden="true"></i>
          Components
        </a>
      </header>

      <div class="row g-4">
        <div class="col-lg-8">
          <div data-image-viewer-demo></div>
        </div>
        <div class="col-lg-4">
          <aside class="demo-status p-3" aria-label="Image viewer actions">
            <h2>Demo Controls</h2>
            <div class="d-grid gap-2 mb-3">
              <button class="btn btn-primary" type="button" data-demo-zoom-in><i class="bi bi-zoom-in" aria-hidden="true"></i> Zoom In</button>
              <button class="btn btn-outline-primary" type="button" data-demo-zoom-out><i class="bi bi-zoom-out" aria-hidden="true"></i> Zoom Out</button>
              <button class="btn btn-outline-primary" type="button" data-demo-reset><i class="bi bi-aspect-ratio" aria-hidden="true"></i> Reset Zoom</button>
              <button class="btn btn-outline-primary" type="button" data-demo-error><i class="bi bi-exclamation-triangle" aria-hidden="true"></i> Test Error Fallback</button>
            </div>
            <h2>Event Bus Activity</h2>
            <ul class="event-log" data-event-log></ul>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/config.js" defer></script>
  <script src="../../js/storage.js" defer></script>
  <script src="../../js/event-bus.js" defer></script>
  <script src="../../js/state-manager.js" defer></script>
  <script src="../../js/component-registry.js" defer></script>
  <script src="../../js/base-component.js" defer></script>
  <script src="../../js/progress-manager.js" defer></script>
  <script src="../../js/router.js" defer></script>
  <script src="../../js/utils.js" defer></script>
  <script src="../../js/assignment-loader.js" defer></script>
  <script src="../../js/engine.js" defer></script>
  <script src="../image-viewer/image-viewer.js" defer></script>
  <script src="../image-label/image-label.js" defer></script>
  <script src="../register-components.js" defer></script>
  <script src="image-viewer-demo.js" defer></script>
</body>
</html>
